name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Test, Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Build extension packages
        run: node build.mjs

      - name: Lint the Firefox package
        run: npx --yes web-ext lint --source-dir dist/firefox

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leetflow-builds
          path: |
            dist/leetflow-chrome.zip
            dist/leetflow-firefox.xpi

      # Only the Chrome package goes on the Release here. The Firefox .xpi
      # added to the Release must be the AMO-signed one, produced below.
      - name: Name the Chrome package for the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: cp dist/leetflow-chrome.zip "dist/leetflow-chrome-${GITHUB_REF_NAME}.zip"

      - name: Verify the Chrome package exists
        if: startsWith(github.ref, 'refs/tags/')
        run: test -f "dist/leetflow-chrome-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/leetflow-chrome-${{ github.ref_name }}.zip
          generate_release_notes: true

  sign-firefox:
    name: Sign Firefox Add-on
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/sign-firefox.yml
    secrets: inherit
