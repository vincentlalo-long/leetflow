name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Test, Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Build extension packages
        run: node build.mjs

      - name: Lint the Firefox package
        run: npx --yes web-ext lint --source-dir dist/firefox

      - name: Name artifacts for the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          cp leetflow-chrome.zip "leetflow-chrome-${GITHUB_REF_NAME}.zip"
          cp leetflow-firefox.xpi "leetflow-firefox-${GITHUB_REF_NAME}.xpi"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leetflow-builds
          path: |
            dist/leetflow-chrome.zip
            dist/leetflow-firefox.xpi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/leetflow-chrome-${{ github.ref_name }}.zip
            dist/leetflow-firefox-${{ github.ref_name }}.xpi
          generate_release_notes: true
