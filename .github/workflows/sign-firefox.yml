name: Sign Firefox Add-on

# Signs dist/firefox with addons.mozilla.org (unlisted channel) so the .xpi
# can be installed permanently from about:addons and survives Firefox restarts.
#
# Required repository secrets:
#   AMO_JWT_ISSUER       - the "Issuer (JWT ID)" from your AMO API key pair
#   AMO_JWT_SIGNING_KEY  - the content of the private key PEM file
#
# Create the key pair once at:
#   https://addons.mozilla.org/en-US/developers/addon/api/key/

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sign:
    name: Sign with AMO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the Firefox package
        run: node build.mjs

      - name: Sign the add-on (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SIGNING_KEY: ${{ secrets.AMO_JWT_SIGNING_KEY }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SIGNING_KEY" ]; then
            echo "Missing AMO_JWT_ISSUER or AMO_JWT_SIGNING_KEY repository secrets." >&2
            exit 1
          fi
          mkdir -p "$HOME/.web-ext"
          printf '%b' "$AMO_JWT_SIGNING_KEY" > "$HOME/.web-ext/amo-signing-key.pem"
          npx --yes web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/signed \
            --channel=unlisted \
            --amo-issuer="$AMO_JWT_ISSUER" \
            --amo-signing-key="$HOME/.web-ext/amo-signing-key.pem"
          rm -f "$HOME/.web-ext/amo-signing-key.pem"

      - name: Upload signed add-on
        uses: actions/upload-artifact@v4
        with:
          name: leetflow-firefox-signed
          path: dist/signed/*.xpi

      - name: Attach signed add-on to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          XPI=$(ls dist/signed/*.xpi | head -n 1)
          gh release upload "${{ github.event.release.tag_name }}" "$XPI" --clobber
