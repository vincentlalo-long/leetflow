name: Sign Firefox Add-on

# Signs dist/firefox with addons.mozilla.org (unlisted channel) so the .xpi
# can be installed permanently from about:addons and survives Firefox restarts.
#
# Runs standalone from the Actions tab, and as a reusable job called by the
# Release workflow so the signed .xpi always lands on the GitHub Release.
#
# Required repository secrets:
#   AMO_JWT_ISSUER  - the JWT issuer / API key, looks like "user:12345678:987"
#   AMO_JWT_SECRET  - the JWT secret / API secret, shown only once at creation
#
# Create the credentials once at:
#   https://addons.mozilla.org/developers/addon/api/key/

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  sign:
    name: Sign with AMO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the Firefox package
        run: node build.mjs

      - name: Sign the add-on (unlisted)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "Missing AMO_JWT_ISSUER or AMO_JWT_SECRET repository secrets." >&2
            exit 1
          fi
          npx --yes web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/signed \
            --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET"

      - name: Name the signed add-on
        id: pkg
        run: |
          XPI=$(ls dist/signed/*.xpi | head -n 1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="leetflow-firefox-${GITHUB_REF_NAME}.xpi"
          else
            NAME="leetflow-firefox-signed.xpi"
          fi
          cp "$XPI" "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: leetflow-firefox-signed
          path: dist/leetflow-firefox-*.xpi

      - name: Attach signed add-on to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ steps.pkg.outputs.name }}" --clobber
